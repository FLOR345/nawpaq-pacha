# ÑAWPAQ PACHA — pronóstico mensual automático y panel público (GitHub Pages)
# Se ejecuta el día 3 de cada mes (y a mano desde la pestaña "Actions").
# Necesita el secreto FIRMS_MAP_KEY (Settings → Secrets and variables → Actions).
name: Pronóstico mensual

on:
  schedule:
    - cron: "0 12 3 * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pronostico:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Pruebas automáticas
        run: python -m pytest -q

      - name: Recuperar datos descargados en ejecuciones anteriores
        uses: actions/cache@v4
        with:
          path: data/raw/cache
          key: datos-${{ github.run_id }}
          restore-keys: datos-

      - name: Descargar datos, entrenar y pronosticar
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python main.py --datos-reales

      - name: Preparar el sitio web
        run: |
          mkdir -p _site/datos
          cp dashboard/index.html dashboard/datos_riesgo.js _site/
          cp outputs/*.csv outputs/evaluacion_modelo.json _site/datos/

      - name: Archivar el pronóstico en la rama "pronosticos"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MES=$(python -c "import json;t=open('dashboard/datos_riesgo.js',encoding='utf-8').read();print(json.loads(t[t.index('{'):].strip().rstrip(';'))['generado'][:7])")
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone -q --depth 1 --branch pronosticos "$URL" /tmp/archivo; then :; else
            git init -q /tmp/archivo && git -C /tmp/archivo checkout -q -b pronosticos && git -C /tmp/archivo remote add origin "$URL"; fi
          rm -rf "/tmp/archivo/$MES" && mkdir -p "/tmp/archivo/$MES"
          cp dashboard/datos_riesgo.js outputs/*.csv outputs/evaluacion_modelo.json "/tmp/archivo/$MES/"
          cd /tmp/archivo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Pronóstico generado en $MES" && git push -q origin pronosticos || echo "Sin cambios"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: pronostico
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
